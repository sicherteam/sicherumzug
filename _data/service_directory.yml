cards:
  privatumzug:
    title: Privatumzug & Wohnungsübersiedlung
    description: Wohnungsumzug aus einer Garçonnière oder Familienwohnung. Möbeltransport, Verpackung und Montage nach Bedarf für Ihre private Übersiedlung vereinbaren.
  firmenumzug-wien:
    title: Büroumzug & Firmenübersiedlung
    description: Büro, Praxis oder Betrieb übersiedeln. Arbeitsplätze, Akten und Betriebsausstattung erfassen und den Firmenumzug mit Ihren Betriebszeiten abstimmen.
  umzug-wien:
    title: Umzug Wien & Wiener Bezirke
    description: Umzugsservice für private Haushalte und Unternehmen in Wien. Etagen, Lift, Ladeplatz und Tragewege an beiden Adressen gemeinsam planen.
  umzug-oesterreich:
    title: Umzug zwischen Österreichs Bundesländern
    description: Übersiedlungsservice mit Start und Ziel in Österreich. Strecke, Übergabetermine, Zwischenstopps und Ankunft vor der Beauftragung abstimmen.
  moebeltransport:
    title: Möbeltransport & Kleintransport
    description: Sofa, Schrank oder einzelne Möbel transportieren lassen. Wenn Sie Möbelpacker buchen möchten, nennen Sie Maße, Gewicht und Zugänge für Abholung und Lieferung.
  moebelmontage:
    title: Möbel abbauen & wieder montieren
    description: Demontage und Möbelmontage für die Übersiedlung vereinbaren. Aufbauanleitungen, zerlegbare Möbel und gewünschte Arbeiten am neuen Standort vorab besprechen.
  verpackungsservice:
    title: Einpackservice & Umzugsverpackung
    description: Hausrat, Geschirr und empfindliche Möbel für den Transport vorbereiten. Räume, Kartons, Polstermaterial und Ihre eigenen Vorbereitungen festlegen.
  wohlfuehl-umzug:
    title: Komplettumzug & Full-Service-Umzug
    description: Einpacken, Tragen, Transport und Möbelaufbau zusammen anfragen. Welche Aufgaben unser Umzugsservice übernimmt, halten wir im schriftlichen Angebot fest.
  hausumzug:
    title: Hausumzug mit Keller, Garage & Garten
    description: Den gesamten Haushalt erfassen, auch Nebenräume und Außenmöbel. Möbelmenge, mehrere Stockwerke und benötigte Fahrten für den Hausumzug gemeinsam planen.
  auslandsumzug:
    title: Internationaler Umzug & Auslandsübersiedlung
    description: Einen Umzug ins Ausland oder nach Österreich vorbereiten. Start, Ziel, Transportumfang und Zeitfenster für die angefragte Strecke persönlich klären.
  seniorenumzug:
    title: Seniorenumzug mit abgestimmter Unterstützung
    description: Die Übersiedlung in eine kleinere Wohnung oder einen neuen Lebensabschnitt planen. Angehörige, Auswahl der Möbel und gewünschte Einpackhilfe einbeziehen.
  studentenumzug:
    title: Studentenumzug & kleine Übersiedlung
    description: Zimmer, WG oder kleine Wohnung übersiedeln. Wenige Möbel, Kartons und Eigenleistungen für einen passenden Transportumfang besprechen.
