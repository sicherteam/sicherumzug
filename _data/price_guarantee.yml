name: Bestpreis-Garantie
title: Bester Preis. Garantiert.
promise: Für denselben Umzug unter denselben Bedingungen unterbieten wir jedes schriftliche Angebot einer anderen Umzugsfirma garantiert um 5 %.
conditions: Verglichen wird der Gesamtpreis inklusive Steuern und aller Zusatzkosten für dieselben Möbel und Kartons, dieselben Adressen, Etagen, Lift- und Zugangsbedingungen sowie dieselben enthaltenen Leistungen.
whatsapp_message: Hallo Sicher Team, ich habe ein schriftliches Umzugsangebot und möchte Ihre Bestpreis-Garantie nutzen. Ich sende Ihnen das Angebot als PDF oder Foto.
