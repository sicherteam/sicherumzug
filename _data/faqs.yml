- question: Können Verpackung und Möbelmontage vereinbart werden?
  answer: Verpackung, Demontage und Montage können Sie nach Bedarf besprechen. Welche Arbeiten übernommen werden, wird im schriftlichen Angebot festgehalten.
- question: Was sollte ich zur Haftung beim Transport klären?
  answer: Besprechen Sie Haftungs- und Versicherungsbedingungen, Ausschlüsse und besondere Werte vor der Beauftragung schriftlich.
- question: Wie wird ein Ladeplatz geplant?
  answer: Nennen Sie Zugänge und mögliche Ladebereiche an beiden Adressen. Ob eine Halteverbotszone benötigt wird und wer die notwendigen Schritte übernimmt, wird vorab abgestimmt.
- question: Was beeinflusst die Kosten?
  answer: Einrichtung, Strecke, Tragewege und Zusatzleistungen bestimmen den Aufwand. Besondere Gegenstände und gewünschte Arbeiten sollten vorab genannt werden.
