<form id="contactForm" enctype="multipart/form-data" class="space-y-4" novalidate>
  <input type="hidden" name="subject" value="Neue Anfrage über die Website"/>
  <div>
    <label class="text-sm font-bold text-gray-900" for="form-name">Name <span class="text-red-600" aria-hidden="true">*</span></label>
    <input id="form-name" name="name" required aria-required="true" type="text" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none transition-colors duration-200" placeholder="Max Mustermann"/>
  </div>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div>
      <label class="text-sm font-bold text-gray-900" for="form-email">E-Mail (optional)</label>
      <input id="form-email" name="email" type="email" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none transition-colors duration-200" placeholder="max@example.com"/>
    </div>
    <div>
      <label class="text-sm font-bold text-gray-900" for="form-phone">Telefon <span class="text-red-600" aria-hidden="true">*</span></label>
      <input id="form-phone" name="phone" required aria-required="true" type="tel" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none transition-colors duration-200" placeholder="{{ site.phone }}"/>
    </div>
  </div>
  <div>
    <label class="text-sm font-bold text-gray-900" for="form-postcode">PLZ <span class="text-red-600" aria-hidden="true">*</span></label>
    <input id="form-postcode" name="postcode" required aria-required="true" type="text" pattern="[0-9]{4}" inputmode="numeric" maxlength="4" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none transition-colors duration-200" placeholder="1010"/>
  </div>
  <div>
    <div class="flex justify-between items-center">
      <label class="text-sm font-bold text-gray-900" for="form-message">Kurzbeschreibung (optional)</label>
      <span id="form-message-counter" class="text-xs text-text-light" aria-live="polite">0 / 1000</span>
    </div>
    <textarea id="form-message" name="message" rows="4" maxlength="1000" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none transition-colors duration-200" placeholder="Was soll geräumt werden? Gibt es Besonderheiten?"></textarea>
  </div>
  <div>
    <label class="text-sm font-bold text-gray-900" for="form-photos">Fotos (optional)</label>
    <input id="form-photos" name="photos[]" type="file" multiple accept="image/*" aria-describedby="form-photos-hint" class="mt-1 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm shadow-sm focus:border-primary-light focus:ring-2 focus:ring-primary-light/30 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 transition-colors duration-200"/>
    <div id="file-preview-container" class="mt-2 grid grid-cols-4 gap-2 empty:hidden"></div>
    <p id="form-photos-hint" class="mt-1.5 text-xs text-text-light">Alternativ können Sie Fotos später per WhatsApp senden.</p>
  </div>
  <div class="pt-2 space-y-3">
    <button type="submit" class="w-full inline-flex items-center justify-center rounded-full bg-primary hover:bg-primary-light text-white px-6 py-4 text-base font-bold shadow hover:shadow-md hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-light focus-visible:ring-offset-2 transition-all duration-200 cursor-pointer">
      Jetzt kostenloses Angebot sichern
    </button>
    <p class="text-xs text-text-light text-center">Wir melden uns innerhalb eines Werktags mit einem Terminvorschlag.</p>
  </div>
</form>

<div id="formResponse" class="mt-4 text-center text-sm font-bold"></div>
