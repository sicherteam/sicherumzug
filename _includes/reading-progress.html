<!-- Master Plan: Reading Progress Bar Modernization -->
<div class="fixed top-0 left-0 w-full h-[3px] z-[100] bg-white/5 pointer-events-none">
  <div id="reading-progress"
       class="h-full bg-primary shadow-[0_0_12px_rgb(var(--color-primary)/0.6)] transition-all duration-150 ease-out"
       style="width: 0%;">
  </div>
</div>

<script>
/**
 * Master Plan - Section 1: Performance Optimized Scroll Logic
 */
document.addEventListener('scroll', function() {
  const scrollTotal = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const progressBar = document.getElementById('reading-progress');

  if (scrollTotal > 0 && progressBar) {
    const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
    const progress = (scrollPosition / scrollTotal) * 100;

    // Tarayıcı performansını korumak için requestAnimationFrame kullanılabilir
    // ancak basit bir genişlik ataması bu boyutta yeterlidir.
    progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
  }
}, { passive: true }); // Kaydırma performansını artırmak için passive: true
</script>
