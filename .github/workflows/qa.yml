name: Website quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _tests/package-lock.json
      - run: npm --prefix _tests ci
      - run: npx playwright install --with-deps chromium
        working-directory: _tests
      - run: npm run test:e2e
      - name: Lighthouse diagnostic (lab, not field Core Web Vitals)
        if: success()
        run: npm run test:performance
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-quality
          path: |
            _tests/artifacts
            _tests/test-results
          retention-days: 14
