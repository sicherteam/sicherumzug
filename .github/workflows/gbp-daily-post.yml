name: GBP Daily SEO Post

on:
  schedule:
    # Runs daily at 06:30 UTC (07:30 CET / 08:30 CEST Vienna time)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

jobs:
  post-to-gbp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth

      - name: Run GBP Daily Poster
        env:
          GBP_TOKEN_JSON: ${{ secrets.GBP_TOKEN_JSON }}
        run: |
          python _automation/gbp_daily_post.py
